[project]
name = "insight"
version = "0.1.0"
description = "Learning to retrieve research inspiration beyond semantic similarity"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets",
    "pandas",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest", "ipykernel", "nbconvert"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insight"]

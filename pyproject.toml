[project]
name = "insight"
version = "0.1.0"
description = "Learning to retrieve research inspiration beyond semantic similarity"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets",
    "pandas",
    "matplotlib",
    "pyyaml>=6.0.3",
    "bm25s>=0.3.16",
    "pystemmer>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ipykernel",
    "nbconvert",
    "ranx>=0.3.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insight"]

# RQ1 inspiration-type labeling (scripts/label_inspiration_types.py), read by insight.inspiration_types.TypeConfig.
# Taxonomy: the eight defined types of arXiv:2610.02202 Table 13, plus the paper's Figure 7 "Others" bar.
# "Others" has no definition in the paper; the wording used for it is ours (decision log, Nov 6, NEEDS REVIEW).
include_other: true
# Show the credited paper title(s) next to the rationale (the abstract is not shown).
include_titles: true
# Labeling model and settings (decision log, Nov 6, NEEDS REVIEW).
model: claude-opus-5-5
effort: low
max_tokens: 1024
# Dry run: a fixed sample of this many rationales, half core and half subfield.
dry_run_n: 20
seed: 0
# USD per million tokens for the printed cost estimate only (Anthropic list prices for the model above).
price_in: 4.0
price_out: 20.0
chars_per_token: 4.0
